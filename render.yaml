services:
  # Frontend Service
  - type: web
    name: vrypto-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://coinbase-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://coinbase-backend.onrender.com/api/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
